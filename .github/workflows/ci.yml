name: Continous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: npm ci
    - name: Build project
      run: npm run build
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up environment
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Run tests
      run: npm run test
